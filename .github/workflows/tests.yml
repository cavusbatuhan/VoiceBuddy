name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # The assistant is a Windows program, so the tests run on Windows too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest
